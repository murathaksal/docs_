<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Denetci.AI Hakem Sunumu</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --ink:#111214; --mid:#55575C; --light:#9B9EA3;
  --rule:#E6E6E4; --rule2:#BEBEBB; --paper:#FFFFFF; --stage:#6E7175;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);font-family:var(--serif);overflow:hidden;color:var(--ink)}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#slide{position:relative;width:1280px;height:720px;background:var(--paper);flex:0 0 auto;
  transform-origin:center center;box-shadow:0 1px 3px rgba(0,0,0,.26),0 14px 44px rgba(0,0,0,.22)}
#slide>div{position:absolute}
body.clean{background:#111214}
body.clean #slide{box-shadow:none}

.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--light);white-space:nowrap}
.title{font-size:33px;line-height:1.12;letter-spacing:-.014em;color:var(--ink);text-wrap:balance}
.lead{font-size:16px;line-height:1.36;color:var(--mid)}
.cap{font-size:13.5px;line-height:1.42;color:var(--light)}
.cap b{color:var(--mid);font-weight:600}
.note{font-size:13.5px;line-height:1.4;color:var(--light);font-style:italic}
.rule{height:1px;background:var(--rule)}
.rule.strong{background:var(--rule2)}
.bandtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--light)}
.bandtxt{font-family:var(--mono);font-size:13px;line-height:1.62;color:var(--mid);font-variant-numeric:tabular-nums}
.foot{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--light)}
.foot.r{text-align:right}
.fig svg{width:100%;height:100%;display:block;color:var(--ink)}
.fig .b{fill:none;stroke:currentColor;stroke-opacity:.24}
.fig .bs{fill:none;stroke:currentColor;stroke-opacity:.7}
.fig .a{stroke:currentColor;stroke-opacity:.4;fill:none}
.fig .ae{stroke:currentColor;stroke-opacity:.85;fill:none}
.fig .d{stroke-dasharray:4 3}
.fig text{fill:currentColor}
.fig .t{font-family:var(--serif);font-size:13px}
.fig .tb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em}
.fig .tm{font-family:var(--serif);font-size:11.5px;fill-opacity:.56}
.fig .tn{font-family:var(--mono);font-size:11px}
.fig .bar{fill:currentColor;fill-opacity:.17}
.fig .bar-e{fill:currentColor;fill-opacity:.85}

.h1{font-size:77px;font-weight:300;line-height:1;letter-spacing:-.036em}
.sub{font-size:28px;font-style:italic;color:var(--mid);line-height:1.22}
.claim{font-family:var(--mono);font-size:16px;letter-spacing:.05em;color:var(--mid)}
.mk{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--light);white-space:nowrap}
.mv{font-size:17px;color:var(--ink);white-space:nowrap}
.mv.s{font-size:16px}
.onum{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--light)}
.oname{font-size:19px;color:var(--ink);line-height:1.2}
.oproof{font-size:14.5px;line-height:1.38;color:var(--mid)}
.closing{font-size:25px;line-height:1.3;color:var(--ink)}

/* ── kapak: ARGELOG bloğu ── */
.cmeta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--light);white-space:nowrap}
.mark{position:absolute;font-size:12.5px;font-weight:600;letter-spacing:.09em;color:var(--light);
  text-align:right;white-space:nowrap}
.tline svg{width:100%;height:100%;display:block;color:var(--ink);overflow:visible}
.tline .tl{fill:none;stroke:currentColor;stroke-opacity:.34;stroke-width:1.2}
.tline .tl.d{stroke-dasharray:4 4;stroke-opacity:.2}
.tline .tn{fill:currentColor;fill-opacity:.88}
.tline .tt{stroke:currentColor;stroke-opacity:.2;stroke-width:1}
.tline text{fill:currentColor}
.tline .ty{font-family:var(--mono);font-size:11px;letter-spacing:.16em;fill-opacity:.52}
.tline .tb{font-size:14.5px;fill-opacity:.95}
.tline .td{font-size:11.5px;fill-opacity:.6}
.refs img.ref{position:absolute;display:block;opacity:.6}
.tw table{border-collapse:collapse;width:100%}
.tw th{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--light);font-weight:400;
  text-align:left;padding:0 14px 9px 0;border-bottom:1px solid var(--rule2);white-space:nowrap}
.tw td{padding:10px 14px 10px 0;color:var(--mid);border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.34}
.tw th:last-child,.tw td:last-child{padding-right:0}
.tw td.b{color:var(--ink);font-weight:600}
.tw td.r{text-align:right;font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw tbody tr:last-child td{border-bottom:1px solid var(--rule2)}
.tw.tight td{padding:7px 14px 7px 0}
.tw.tight th{padding-bottom:7px}


#bar{position:fixed;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:16px;
  padding:0 18px;background:#141517;color:#D8DADE;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;z-index:10;transition:opacity .2s}
#bar b{font-family:var(--serif);font-size:13.5px;font-weight:600;letter-spacing:0;color:#fff}
#bar .sp{margin-left:auto;display:flex;gap:18px;align-items:center}
#bar button{font:inherit;color:#9B9EA3;background:none;border:0;border-bottom:1px solid #3A3D42;
  padding:2px 0;cursor:pointer;letter-spacing:.06em}
#bar button:hover{color:#fff;border-bottom-color:#fff}
#bar button[aria-pressed="true"]{color:#fff;border-bottom-color:#fff}
#ticks{position:fixed;left:0;right:0;top:40px;height:3px;display:flex;gap:1px;z-index:10}
#ticks button{flex:1;height:3px;border:0;padding:0;background:#3A3D42;cursor:pointer}
#ticks button:hover{background:#9B9EA3}
#ticks button[aria-current="true"]{background:#fff}
body.clean #bar,body.clean #ticks{opacity:0;pointer-events:none}

#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:26px;width:100%;max-width:1200px;max-height:100%;overflow:auto}
#grid button{all:unset;cursor:pointer;display:block}
#grid .th{position:relative;display:block;width:100%;padding-top:56.25%;background:#fff;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#grid .inner{position:absolute;top:0;left:0;width:1280px;height:720px;transform:scale(.2205);transform-origin:top left;display:block}
#grid .inner>div{position:absolute}
#grid .lbl{display:block;font-family:var(--mono);font-size:10px;color:#D8DADE;margin-top:7px;letter-spacing:.06em}
#grid button:hover .lbl{color:#fff}

#notes{position:fixed;left:0;right:0;bottom:0;height:0;overflow:auto;background:#141517;color:#C9CBD0;
  font-size:15px;line-height:1.62;padding:0 30px;z-index:9;transition:height .18s}
body.notes #notes{height:210px;padding:20px 30px}
#notes h4{margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#797C82;font-weight:400}
#notes p{margin:0 0 11px;max-width:98ch}
#notes p:last-child{margin:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

#print{display:none}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  html,body{background:#fff;overflow:visible;height:auto}
  #bar,#ticks,#notes,#stage,#grid{display:none!important}
  #print{display:block!important}
  .psl{position:relative;width:1280px;height:720px;page-break-after:always;break-after:page;overflow:hidden;background:#fff}
  .psl:last-child{page-break-after:auto;break-after:auto}
  .psl>div{position:absolute}
  .psl svg{width:100%;height:100%}
  .psl img{max-width:none}
}
@media (max-width:640px){#bar{gap:10px;padding:0 12px;font-size:10px}#bar .sp{gap:12px}}
</style>

giyle ayrılmıştır. Model hiçbir aşamada tutar hesaplamaz; ayrım kod düzeyinde kuruludur ve denetim iziyle kanıtlanabilir.</div><div class=\"fig\" style=\"left:82px;top:197px;width:954px;height:397px\"><svg class=\"dgm\" viewBox=\"0 0 680 274\" role=\"img\" aria-label=\"Motor farkı üretir, model bulguyu inceler, doğrulama kapısı atıfları denetler, insan karar verir ve getirilen belgeyle motor yeniden koşar. Modelden tutara giden bir yol yoktur.\">\n      <defs><marker id=\"mk4\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"currentColor\" fill-opacity=\".42\"/></marker></defs>\n      <path class=\"a d\" d=\"M590,64 L590,34 L345,34 L345,60\" marker-end=\"url(#mk4)\"/>\n      <text class=\"tm\" x=\"467\" y=\"26\" text-anchor=\"middle\">dayanaksız iddia elenir, eğitime döner</text>\n      <rect class=\"bs\" x=\"10\" y=\"68\" width=\"140\" height=\"48\"/>\n      <text class=\"tb\" x=\"80\" y=\"90\" text-anchor=\"middle\">MOTOR</text><text class=\"tm\" x=\"80\" y=\"106\" text-anchor=\"middle\">hesaplar</text>\n      <rect class=\"bs\" x=\"275\" y=\"68\" width=\"140\" height=\"48\"/>\n      <text class=\"tb\" x=\"345\" y=\"90\" text-anchor=\"middle\">MODEL</text><text class=\"tm\" x=\"345\" y=\"106\" text-anchor=\"middle\">inceler, soru sorar</text>\n      <rect class=\"bs\" x=\"520\" y=\"68\" width=\"140\" height=\"48\"/>\n      <text class=\"tb\" x=\"590\" y=\"90\" text-anchor=\"middle\">KAPI</text><text class=\"tm\" x=\"590\" y=\"106\" text-anchor=\"middle\">atfı doğrular</text>\n      <line class=\"a\" x1=\"150\" y1=\"92\" x2=\"268\" y2=\"92\" marker-end=\"url(#mk4)\"/>\n      <text class=\"tm\" x=\"209\" y=\"84\" text-anchor=\"middle\">fark</text>\n      <line class=\"a\" x1=\"415\" y1=\"92\" x2=\"513\" y2=\"92\" marker-end=\"url(#mk4)\"/>\n      <text class=\"tm\" x=\"464\" y=\"84\" text-anchor=\"middle\">bulgu + atıf</text>\n      <line class=\"a\" x1=\"590\" y1=\"116\" x2=\"590\" y2=\"174\" marker-end=\"url(#mk4)\"/>\n      <text class=\"tm\" x=\"580\" y=\"149\" text-anchor=\"end\">geçen bulgu</text>\n      <rect class=\"bs\" x=\"520\" y=\"180\" width=\"140\" height=\"48\"/>\n      <text class=\"tb\" x=\"590\" y=\"202\" text-anchor=\"middle\">İNSAN</text><text class=\"tm\" x=\"590\" y=\"218\" text-anchor=\"middle\">karar verir, mühürler</text>\n      <path class=\"a\" d=\"M520,204 L468,204 L468,250 L80,250 L80,122\" marker-end=\"url(#mk4)\"/>\n      <text class=\"tm\" x=\"274\" y=\"264\" text-anchor=\"middle\">belge getirilir, motor yeniden koşar</text>\n      <line class=\"a d\" x1=\"345\" y1=\"116\" x2=\"345\" y2=\"174\"/>\n      <line class=\"ae\" x1=\"337\" y1=\"137\" x2=\"353\" y2=\"153\"/><line class=\"ae\" x1=\"353\" y1=\"137\" x2=\"337\" y2=\"153\"/>\n      <rect class=\"b d\" x=\"275\" y=\"180\" width=\"140\" height=\"44\"/>\n      <text class=\"t\" x=\"345\" y=\"207\" text-anchor=\"middle\">TUTAR</text>\n      <text class=\"tm\" x=\"265\" y=\"139\" text-anchor=\"end\">model hesaba</text>\n      <text class=\"tm\" x=\"265\" y=\"155\" text-anchor=\"end\">hiç girmez</text>\n    </svg></div><div class=\"cap\" style=\"left:82px;top:607px;width:1116px\">Çarpı işaretli kesik çizgi mimarinin taşıyıcı tercihidir: modelden tutara giden bir yol yoktur. Modelin yanılması hatalı tutar değil, gereksiz bir inceleme adımı üretir.</div><div class=\"foot\" style=\"left:82px;top:670px\">Denetci.AI&nbsp;&nbsp;·&nbsp;&nbsp;ARGELOG-002&nbsp;&nbsp;·&nbsp;&nbsp;04&nbsp;/&nbsp;12</div><div class=\"mark\" style=\"right:82px;top:659px\">ARGELOG</div>", "<div class=\"eyebrow\" style=\"left:82px;top:42px;width:1116px\">05  ·  ARAŞTIRMA SORUSU 1</div><div class=\"title\" style=\"left:82px;top:71px;width:634px\">Denetçi rolü dar kapsamlı bir modele öğretilebilir mi?</div><div class=\"lead\" style=\"left:744px;top:75px;width:454px\">Bu göreve elle etiketli eğitim verisi üretmek ölçeklenebilir değildir. Önerilen yaklaşım, doğrulanmış deterministik motoru referans kaynağı olarak kullanmaktır.</div><div class=\"fig\" style=\"left:82px;top:197px;width:1031px;height:336px\"><svg class=\"dgm\" viewBox=\"0 0 680 212\" role=\"img\" aria-label=\"Senaryo, enjeksiyon ve pilot verisi motordan geçerek fark imzası ve kural sürümü üretir; buradan eğitim çiftleri çıkar. Araştırma yönlendirme görevinde etiketi motorun yeniden koşumu otomatik olarak koyar.\">\n      <defs><marker id=\"mk5\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"currentColor\" fill-opacity=\".42\"/></marker></defs>\n      <rect class=\"b\" x=\"10\" y=\"16\" width=\"150\" height=\"34\"/><text class=\"t\" x=\"22\" y=\"38\">≥60 senaryo</text>\n      <rect class=\"b\" x=\"10\" y=\"62\" width=\"150\" height=\"34\"/><text class=\"t\" x=\"22\" y=\"84\">≥400 enjeksiyon</text>\n      <rect class=\"b\" x=\"10\" y=\"108\" width=\"150\" height=\"34\"/><text class=\"t\" x=\"22\" y=\"130\">pilot kayıtları</text>\n      <line class=\"a\" x1=\"160\" y1=\"33\" x2=\"243\" y2=\"70\" marker-end=\"url(#mk5)\"/>\n      <line class=\"a\" x1=\"160\" y1=\"79\" x2=\"243\" y2=\"79\" marker-end=\"url(#mk5)\"/>\n      <line class=\"a\" x1=\"160\" y1=\"125\" x2=\"243\" y2=\"88\" marker-end=\"url(#mk5)\"/>\n      <rect class=\"bs\" x=\"250\" y=\"52\" width=\"130\" height=\"54\"/>\n      <text class=\"tb\" x=\"315\" y=\"75\" text-anchor=\"middle\">MOTOR</text><text class=\"tm\" x=\"315\" y=\"91\" text-anchor=\"middle\">referans kaynağı</text>\n      <line class=\"a\" x1=\"380\" y1=\"79\" x2=\"428\" y2=\"79\" marker-end=\"url(#mk5)\"/>\n      <rect class=\"b\" x=\"435\" y=\"52\" width=\"235\" height=\"54\"/>\n      <text class=\"t\" x=\"552\" y=\"74\" text-anchor=\"middle\">Fark imzası ve</text><text class=\"t\" x=\"552\" y=\"92\" text-anchor=\"middle\">uygulanan kural sürümü</text>\n      <line class=\"a\" x1=\"552\" y1=\"106\" x2=\"552\" y2=\"140\" marker-end=\"url(#mk5)\"/>\n      <rect class=\"b\" x=\"435\" y=\"146\" width=\"235\" height=\"38\"/>\n      <text class=\"t\" x=\"552\" y=\"170\" text-anchor=\"middle\">Eğitim çifti · G1-G4</text>\n      <path class=\"a\" d=\"M435,165 L315,165 L315,112\" marker-end=\"url(#mk5)\"/>\n      <text class=\"tm\" x=\"10\" y=\"204\">G2 · önerilen belge getirilir, motor yeniden koşar, etiketi hiç kimse elle koymaz</text>\n    </svg></div><div class=\"cap\" style=\"left:82px;top:546px;width:1116px\">Etiketin kaynağı model değil, 96 gerçek dönemde kuruş farksız doğrulanmış motordur. Özyineleme bulunmadığı için sentetik veriyle eğitimin bilinen çöküş mekanizması oluşmaz.</div><div class=\"rule strong\" style=\"left:82px;top:591px;width:1116px\"></div><div class=\"bandtag\" style=\"left:82px;top:601px;width:1116px\">BAŞARISIZLIK EŞIĞI · AY 10 VE 12</div><div class=\"bandtxt\" style=\"left:82px;top:623px;width:1116px\">Yönlendirme isabeti ≥ %70  |  ince ayarsız temel modele karşı ≥ 15 puan<br>Uzmanın bulgularının ≥ %80&#x27;i yakalanır  |  soru nitelenme oranı ≥ %70</div><div class=\"foot\" style=\"left:82px;top:670px\">Denetci.AI&nbsp;&nbsp;·&nbsp;&nbsp;ARGELOG-002&nbsp;&nbsp;·&nbsp;&nbsp;05&nbsp;/&nbsp;12</div><div class=\"mark\" style=\"right:82px;top:659px\">ARGELOG</div>", "<div class=\"eyebrow\" style=\"left:82px;top:42px;width:1116px\">06  ·  ARAŞTIRMA SORUSU 2</div><div class=\"title\" style=\"left:82px;top:71px;width:634px\">Gerekçeler sembolik kural tabanına karşı kanıta bağlanabilir mi?</div><div class=\"lead\" style=\"left:744px;top:75px;width:454px\">Dil modellerinin bilinen zayıflığı akıcı fakat dayanaksız iddia üretmeleridir. Mevzuat alanında bu, var olmayan bir maddeye atıf ya da ilgili dönemde yürürlükte olmayan bir kurala dayanma biçiminde ortaya çıkar.</div><div class=\"fig\" style=\"left:82px;top:197px;width:1077px;height:336px\"><svg class=\"dgm\" viewBox=\"0 0 680 202\" role=\"img\" aria-label=\"Model bulguları doğrulama kapısında iki soruya tabi tutulur; geçenler kullanıcıya gider, elenenler ince ayar turuna olumsuz örnek olarak döner.\">\n      <defs><marker id=\"mk6\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"currentColor\" fill-opacity=\".42\"/></marker></defs>\n      <rect class=\"bs\" x=\"10\" y=\"74\" width=\"150\" height=\"48\"/>\n      <text class=\"t\" x=\"85\" y=\"94\" text-anchor=\"middle\">Model bulgusu</text><text class=\"tm\" x=\"85\" y=\"111\" text-anchor=\"middle\">şema zorlamalı</text>\n      <line class=\"a\" x1=\"160\" y1=\"98\" x2=\"233\" y2=\"98\" marker-end=\"url(#mk6)\"/>\n      <rect class=\"bs\" x=\"240\" y=\"28\" width=\"245\" height=\"140\"/>\n      <text class=\"tb\" x=\"362\" y=\"52\" text-anchor=\"middle\">DOĞRULAMA KAPISI</text>\n      <line class=\"b\" x1=\"258\" y1=\"64\" x2=\"467\" y2=\"64\"/>\n      <text class=\"t\" x=\"258\" y=\"90\">1 &#160;·&#160; Madde var mı?</text>\n      <text class=\"t\" x=\"258\" y=\"116\">2 &#160;·&#160; O dönemde yürürlükte miydi?</text>\n      <text class=\"tm\" x=\"258\" y=\"146\">her atıf kural tabanına sorulur</text>\n      <path class=\"a\" d=\"M485,80 L510,80 L510,58 L528,58\" marker-end=\"url(#mk6)\"/>\n      <path class=\"a\" d=\"M485,124 L510,124 L510,146 L528,146\" marker-end=\"url(#mk6)\"/>\n      <rect class=\"b\" x=\"535\" y=\"36\" width=\"135\" height=\"44\"/><text class=\"t\" x=\"602\" y=\"63\" text-anchor=\"middle\">Kullanıcıya</text>\n      <rect class=\"b d\" x=\"535\" y=\"124\" width=\"135\" height=\"44\"/><text class=\"t\" x=\"602\" y=\"151\" text-anchor=\"middle\">Elenen</text>\n      <path class=\"a d\" d=\"M602,168 L602,192 L85,192 L85,128\" marker-end=\"url(#mk6)\"/>\n      <text class=\"tm\" x=\"240\" y=\"186\">olumsuz örnek olarak ince ayar turuna döner</text>\n    </svg></div><div class=\"cap\" style=\"left:82px;top:546px;width:1116px\">Kapı hiçbir tutarı gizlemez: motorun bulduğu fark her koşulda kullanıcıya ulaşır. Elenen şey tutar değil, modelin o fark üzerine yazdığı yorumdur.</div><div class=\"rule strong\" style=\"left:82px;top:591px;width:1116px\"></div><div class=\"bandtag\" style=\"left:82px;top:601px;width:1116px\">BAŞARISIZLIK EŞIĞI · AY 10</div><div class=\"bandtxt\" style=\"left:82px;top:623px;width:1116px\">Atıf doğruluğu ≥ %98  |  desteksiz iddia ≤ %1</div><div class=\"foot\" style=\"left:82px;top:670px\">Denetci.AI&nbsp;&nbsp;·&nbsp;&nbsp;ARGELOG-002&nbsp;&nbsp;·&nbsp;&nbsp;06&nbsp;/&nbsp;12</div><div class=\"mark\" style=\"right:82px;top:659px\">ARGELOG</div>", "<div class=\"eyebrow\" style=\"left:82px;top:42px;width:1116px\">07  ·  ARAŞTIRMA SORUSU 3</div><div class=\"title\" style=\"left:82px;top:71px;width:634px\">Abdüktif kök-neden teşhisi: sembolik üretim, nöral sıralama</div><div class=\"lead\" style=\"left:744px;top:75px;width:454px\">Farkı bulmak deterministiktir. Belirsizlik, farkın kök nedenine atanmasındadır; birden çok neden matematiksel olarak aynı fark görüntüsünü üretebilir.</div><div class=\"fig\" style=\"left:82px;top:197px;width:855px;height:336px\"><svg class=\"dgm\" viewBox=\"0 0 680 258\" role=\"img\" aria-label=\"Tek bir fark tutarı yedi ayrı kök nedenle açıklanabilir; sembolik katman bu kümeyi eksiksiz üretir, nöral katman sıralar ve kanıt belgesi ister, ayırt edilemeyen kalem belirsiz olarak raporlanır.\">\n      <defs><marker id=\"mk7\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"currentColor\" fill-opacity=\".42\"/></marker></defs>\n      <rect class=\"bs\" x=\"10\" y=\"104\" width=\"140\" height=\"48\"/>\n      <text class=\"tn\" x=\"80\" y=\"126\" text-anchor=\"middle\">12.480,00 ₺</text><text class=\"tm\" x=\"80\" y=\"143\" text-anchor=\"middle\">tek fark</text>\n      <rect class=\"b\" x=\"200\" y=\"8\" width=\"250\" height=\"242\"/>\n      <text class=\"tb\" x=\"212\" y=\"28\">EKSİKSİZ HİPOTEZ KÜMESİ</text>\n      <text class=\"t\" x=\"214\" y=\"56\">Yuvarlama</text>\n      <text class=\"t\" x=\"214\" y=\"84\">Kapsam-personel farkı</te :702px;top:255px;width:496px\">Yönlendirme ≥ %70, atıf ≥ %98, grafik işlemcisiz çalışır</div><div class=\"rule strong\" style=\"left:82px;top:376px;width:534px\"></div><div class=\"onum\" style=\"left:82px;top:388px\">3</div><div class=\"oname\" style=\"left:120px;top:384px;width:496px\">THS 7 prototip, iki referans vaka</div><div class=\"oproof\" style=\"left:120px;top:418px;width:496px\">Tüpraş ve Kale Seramik&#x27;te ücretli pilot; yazılı ihtiyaç görüşleri alındı</div><div class=\"rule strong\" style=\"left:664px;top:376px;width:534px\"></div><div class=\"onum\" style=\"left:664px;top:388px\">4</div><div class=\"oname\" style=\"left:702px;top:384px;width:496px\">Fikri mülkiyet</div><div class=\"oproof\" style=\"left:702px;top:418px;width:496px\">Marka başvurusu; ay 9&#x27;da patentlenebilirlik ön değerlendirmesi</div><div class=\"rule\" style=\"left:82px;top:545px;width:1116px\"></div><div class=\"cap\" style=\"left:82px;top:559px;width:1116px\"><b>TTO’dan talebimiz:</b> yapay zekâ tarafında akademisyen danışmanlığı; ay 7 ve ay 10’da bağımsız gözden geçirme.&nbsp;&nbsp;·&nbsp;&nbsp;<b>Bölgeye taahhüdümüz:</b> 4 kişiyle başlayıp 6; beş bölge firmasına 4691 ön sürümü; iki seminer; TTO ile ortak bildiri.</div><div class=\"closing\" style=\"left:82px;top:618px;width:1116px\">Hesabı motor yapar, bulguyu model inceler, kararı insan verir.</div><div class=\"foot\" style=\"left:82px;top:670px\">Denetci.AI&nbsp;&nbsp;·&nbsp;&nbsp;ARGELOG-002&nbsp;&nbsp;·&nbsp;&nbsp;12&nbsp;/&nbsp;12</div><div class=\"mark\" style=\"right:82px;top:659px\">ARGELOG</div>"];
const TITLES = ["Denetci.AI", "Kapanmış dönem, kendi kural sürümüyle yeniden üretilemiyor", "Mevzuat alanında dil modeli hesap ve karar üretemez", "İş bölümü: motor hesaplar, model inceler, insan karar verir", "Denetçi rolü dar kapsamlı bir modele öğretilebilir mi?", "Gerekçeler sembolik kural tabanına karşı kanıta bağlanabilir mi?", "Abdüktif kök-neden teşhisi: sembolik üretim, nöral sıralama", "Üç eksenli yürürlük tarihli sürümleme ve ifade edilebilirlik sınırı", "Ölçüm düzeneği ve başarısızlık eşikleri", "İş paketleri, ölçüm kapıları ve kaynak dağılımı", "Başarısızlık senaryosu ve risk asimetrisi", "Proje çıktıları ve teknopark katkısı"];
const slideEl = document.getElementById('slide');
const stageEl = document.getElementById('stage');
const ticks = document.getElementById('ticks');
const counter = document.getElementById('counter');
let i = 0, gridOn = false;

const tickEls = SLIDES.map((_, n) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('aria-label', 'Slayt ' + (n + 1));
  b.addEventListener('click', () => go(n));
  ticks.appendChild(b); return b;
});

function fit(){
  const bar = document.body.classList.contains('clean') ? 0 : 43;
  const nh = 0;
  const k = Math.min((window.innerWidth - 40) / 1280, (window.innerHeight - bar - nh - 40) / 720);
  slideEl.style.transform = 'scale(' + k + ')';
  stageEl.style.paddingTop = bar + 'px';
  stageEl.style.paddingBottom = nh + 'px';
}
function paint(){
  slideEl.innerHTML = SLIDES[i];
  counter.textContent = String(i + 1).padStart(2, '0') + ' / ' + SLIDES.length;
  tickEls.forEach((el, n) => el.setAttribute('aria-current', n === i ? 'true' : 'false'));
  try { localStorage.setItem('dai-slide', String(i)); } catch(e){}
  fit();
}
function go(n){ i = Math.max(0, Math.min(SLIDES.length - 1, n)); if (gridOn) setGrid(false); paint(); }

function setGrid(on){
  gridOn = on;
  document.getElementById('bGrid').setAttribute('aria-pressed', String(on));
  if (on) {
    slideEl.style.display = 'none';
    let g = document.getElementById('grid');
    if (!g) { g = document.createElement('div'); g.id = 'grid'; stageEl.appendChild(g); }
    g.innerHTML = SLIDES.map((s, n) =>
      '<button data-n="' + n + '"><span class="th"><span class="inner">' + s + '</span></span>'
      + '<span class="lbl">' + String(n + 1).padStart(2, '0') + ' · ' + TITLES[n].slice(0, 36) + '</span></button>').join('');
    g.querySelectorAll('button').forEach(b => b.addEventListener('click', () => go(+b.dataset.n)));
  } else {
    const g = document.getElementById('grid'); if (g) g.remove();
    slideEl.style.display = '';
  }
}
function toggle(cls, btn){
  document.body.classList.toggle(cls);
  if (btn) btn.setAttribute('aria-pressed', String(document.body.classList.contains(cls)));
  fit();
}
document.getElementById('bClean').addEventListener('click', e => toggle('clean', e.currentTarget));
document.getElementById('bGrid').addEventListener('click', () => setGrid(!gridOn));
document.getElementById('bFull').addEventListener('click', () => {
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
});
document.addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(SLIDES.length - 1);
  else if (k === 'g' || k === 'G') setGrid(!gridOn);
  else if (k === 's' || k === 'S') toggle('clean', document.getElementById('bClean'));
  else if (k === 'f' || k === 'F') document.getElementById('bFull').click();
  else if (k === 'p' || k === 'P') window.print();
});
window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);
try { const sv = parseInt(localStorage.getItem('dai-slide') || '0', 10); if (!isNaN(sv)) i = Math.max(0, Math.min(SLIDES.length - 1, sv)); } catch(e){}
// yazdırma bloğu koşum anında kurulur: slaytlar dosyada bir kez durur
document.getElementById('print').innerHTML =
  SLIDES.map(s => '<div class="psl">' + s + '</div>').join('');
paint();
</script>
